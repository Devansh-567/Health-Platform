version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hms_db
    ports:
      - "5432:5432"
    volumes:
      - hms_pg_data:/var/lib/postgresql/data

volumes:
  hms_pg_data:
